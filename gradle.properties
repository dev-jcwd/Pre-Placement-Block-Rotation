org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true

# Mod Properties (1.3.0 is the semver form of "version 1.3")
mod_version=1.3.0
mod_group_id=com.rotationplacement
mod_id=rotationplacement

# Loader / Loom (same for every Minecraft version)
loader_version=0.18.1
loom_version=1.19-SNAPSHOT

# --- Build target. Defaults to 1.21.1; build-all.ps1 builds every supported version. ---
# lane: "yarn" = 1.21 - 1.21.11 (Yarn names, Java 21)   "official" = 26.1 and newer (Mojang names, Java 25)
lane=yarn
minecraft_version=1.21.1
yarn_mappings=1.21.1+build.3
fabric_version=0.116.18+1.21.1
# Which src/compat/<name> folder supplies the version-specific calls
compat=y1
# Minecraft versions written into fabric.mod.json
mc_range=>=1.21 <1.21.2
# Java the jar targets
java_version=21
# Extra mixin class (only 1.21.9 needs one: WorldRendererMixin), added to the mixin config
extra_mixin=
